spring:
  application:
    name: reservation-api
  profiles:
    default: ${CONFIG_PROFILE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 10
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          authorities-claim-name: role
          authority-prefix: ROLE_

logging:
  structured:
    # JSON lines; MDC (requestId) becomes a field on every line
    format:
      console: ecs

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    dev-token-enabled: ${DEV_TOKEN_ENABLED:true}
  reserve:
    # ceiling, not added latency: ~ client in-flight cap / measured tx/s (WRITEUP "Admission")
    admission-wait: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # names only (db, readinessState), no details
      show-components: always
      probes:
        enabled: true
      group:
        # liveness stays process-only: a DB outage must not get the app restarted.
        # readiness fails closed: DB unreachable (pool timeout 2s) -> DOWN -> 503
        readiness:
          include: readinessState,db
