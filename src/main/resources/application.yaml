spring:
  application:
    name: reservation-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservations}
    username: ${DB_USER:reservations}
    password: ${DB_PASSWORD:reservations}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 10
      connection-timeout: 2000
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
