spring:
  application:
    name: reservation-api
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 10
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          authorities-claim-name: role
          authority-prefix: ROLE_

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    dev-token-enabled: ${DEV_TOKEN_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
