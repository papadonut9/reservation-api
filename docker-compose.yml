services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations"]
      interval: 2s
      retries: 15
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/reservations
      SPRING_DATASOURCE_USERNAME: reservations
      SPRING_DATASOURCE_PASSWORD: reservations
      # local-only placeholder; real deploys set JWT_SECRET from the platform secret store
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-not-a-secret-0123456789}
      DEV_TOKEN_ENABLED: "true"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
